global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'users'
    static_configs:
      - targets: ['users-service:9091']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'auth'
    static_configs:
      - targets: ['auth-service:9092']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'documents'
    static_configs:
      - targets: ['documents-service:9093']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'chat'
    static_configs:
      - targets: ['chat-service:9094']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'index-python'
    static_configs:
      - targets: ['index-python:9095']
    metrics_path: '/metrics'
    scrape_interval: 10s
